name: SentinelCI Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to the same PR cancels the older, now-outdated run
concurrency:
  group: sentinelci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sentinelci:
    runs-on: ubuntu-latest
    name: AI-Powered CI Analysis
    timeout-minutes: 30

    # GITHUB_TOKEN is read-only by default; posting the PR comment needs write access.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # ── Step 1: Checkout ─────────────────────────────────────
      # Checks out the PR's code. Credentials aren't kept in .git/config,
      # so code run by later steps (including generated tests) can't read the token.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── Step 2: Setup Python ──────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── Step 3: Install dependencies ─────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Run SentinelCI Pipeline (Phases 1-9) ─────────
      - name: Run SentinelCI Pipeline
        id: sentinelci
        env:
          GITHUB_URL: ${{ github.event.repository.html_url }}
          PR_OWNER: ${{ github.repository_owner }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.number }}
          # Analyze the checked-out PR code directly instead of downloading it
          REPO_PATH: ${{ github.workspace }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_SIMILARITY_THRESHOLD: "0.50"
          SEMANTIC_TOP_K: "10"
        run: |
          python main.py
        # Hard fail if core phases 1-4 fail
        # Phase 5 failure is handled gracefully inside main.py

      # ── Step 5: Validate risk report exists (fail-safe) ──────
      - name: Validate risk report exists
        run: |
          python -c "
          import os, sys
          if not os.path.exists('storage/risk_report.json'):
              print('FAIL-SAFE: risk_report.json missing.')
              print('Core pipeline failed — blocking merge.')
              sys.exit(1)
          if not os.path.exists('storage/ci_decision.json'):
              print('FAIL-SAFE: ci_decision.json missing.')
              print('CI decision unavailable — blocking merge.')
              sys.exit(1)
          print('Risk report and CI decision found.')
          "

      # ── Step 6: Risk-based test execution ────────────────────
      # Runs the test runs chosen in storage/ci_decision.json and saves
      # results to storage/test_execution.json for the PR comment.
      # Fails if a blocking run fails; generated tests never block.
      - name: Execute selected tests
        run: |
          python -m ci.run_tests

      # ── Step 7: Post PR comment with full report ──────────────
      # Runs even when earlier steps fail, so the PR always shows a status.
      # A comment failure shows as a warning but doesn't fail the job.
      - name: Post PR analysis comment
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_OWNER: ${{ github.repository_owner }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          python -c "
          import os
          from ci.pr_reporter import PRReporter

          reporter = PRReporter(
              repo_owner=os.environ['PR_OWNER'],
              repo_name=os.environ['PR_REPO'],
              pr_number=int(os.environ['PR_NUMBER']),
              github_token=os.environ.get('GITHUB_TOKEN')
          )
          reporter.save_report()
          reporter.post_comment()
          "

      # ── Step 8: Upload all artifacts ─────────────────────────
      - name: Upload SentinelCI artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sentinelci-reports-pr-${{ github.event.number }}
          path: |
            storage/risk_report.json
            storage/impact_analysis.json
            storage/semantic_impact.json
            storage/test_selection.json
            storage/test_generation.json
            storage/test_execution.json
            storage/ci_decision.json
            storage/pr_report.md
            storage/dependency_graph.json
            storage/dependency_metrics.json
            storage/pr_analysis.json
            generated_tests/
          retention-days: 30

      # ── Step 9: Risk-based gate (final pass/fail) ─────────────
      - name: Enforce risk gate
        run: |
          python -c "
          import json, sys

          with open('storage/ci_decision.json') as f:
              decision = json.load(f)

          status = decision.get('pipeline_status', 'blocked')
          risk = decision.get('risk_level', 'unknown')
          score = decision.get('risk_score', 100)
          action = decision.get('ci_action', 'unknown')
          message = decision.get('message', '')

          print('=' * 50)
          print('  SENTINELCI GATE RESULT')
          print('=' * 50)
          print(f'  Pipeline Status : {status.upper()}')
          print(f'  Risk Level      : {risk.upper()}')
          print(f'  Risk Score      : {score}/100')
          print(f'  CI Action       : {action}')
          print(f'  Message         : {message}')
          print('=' * 50)

          if status == 'blocked':
              print('GATE FAILED: Critical risk — merge blocked.')
              sys.exit(1)
          elif status == 'warning':
              print('GATE WARNING: High risk — proceed with caution.')
              sys.exit(0)
          else:
              print('GATE PASSED: Risk within acceptable threshold.')
              sys.exit(0)
          "
